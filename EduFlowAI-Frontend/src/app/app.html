<!-- Main container wrapping our test area -->
<div class="p-8 flex flex-col gap-12 bg-[#f7f9fb] min-h-screen" dir="ltr">
      
  <!-- Testing Status Timeline -->
  <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 max-w-4xl mx-auto w-full">
    <h2 class="text-xl font-bold mb-6 text-[#022448]">Testing Status Timeline</h2>
    
    <!-- Bind the mock signal to the required input -->
    <app-status-timeline [status]="mockTimelineStatus()"></app-status-timeline>
    
    <!-- Action buttons to test how the timeline reacts to state changes -->
    <div class="mt-10 flex gap-4 flex-wrap border-t pt-4">
      <button class="px-4 py-2 bg-gray-200 rounded text-sm font-bold" 
              (click)="mockTimelineStatus.set('Draft')">
        Set Draft
      </button>
      <button class="px-4 py-2 bg-blue-100 text-blue-800 rounded text-sm font-bold" 
              (click)="mockTimelineStatus.set('DocumentsRequired')">
        Set Documents Required
      </button>
      <button class="px-4 py-2 bg-green-100 text-green-800 rounded text-sm font-bold" 
              (click)="mockTimelineStatus.set('Admitted')">
        Set Admitted
      </button>
    </div>
  </div>

  <!-- Testing Stage Stepper -->
  <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 max-w-4xl mx-auto w-full">
    <h2 class="text-xl font-bold mb-6 text-[#022448]">Testing Stage Stepper</h2>
    
    <!-- Bind the mock signals to the required inputs -->
    <app-stage-stepper 
      [englishStatus]="mockEnglish()"
      [iqStatus]="mockIq()"
      [technicalStatus]="mockTech()"
      [interviewStatus]="mockInterview()">
    </app-stage-stepper>

    <!-- Action buttons to test how the stepper reacts to state changes -->
    <div class="mt-8 flex gap-4 flex-wrap border-t pt-4">
      <button class="px-4 py-2 bg-gray-200 rounded text-sm font-bold" 
              (click)="resetStepper()">
        Reset All
      </button>
      <button class="px-4 py-2 bg-blue-100 text-blue-800 rounded text-sm font-bold" 
              (click)="passEnglishStartIq()">
        Pass English, Start IQ
      </button>
    </div>
  </div>

</div>
