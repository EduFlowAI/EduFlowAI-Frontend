<div class="max-w-3xl mx-auto mt-10 bg-white p-8 rounded-2xl shadow-lg border border-gray-100">
    <div class="mb-8 text-center">
      <h2 class="text-3xl font-extrabold text-gray-800 mb-2">Start New Application</h2>
      <p class="text-gray-500 text-sm">Select the admission cycle to begin your application process.</p>
    </div>
  
    <!-- Display global error from the store if the draft creation fails -->
    @if (store.error()) {
      <div class="mb-6 p-4 rounded-lg bg-red-50 border-l-4 border-red-500 text-red-700 flex items-center gap-3">
        <i class="pi pi-exclamation-triangle text-xl"></i>
        <span class="font-medium">{{ store.error() }}</span>
      </div>
    }
  
    <!-- Reactive Form connected to our component -->
    <form [formGroup]="createForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
      <fieldset class="border border-gray-200 rounded-xl p-6 bg-gray-50">
        <legend class="text-lg font-semibold text-gray-700 px-3">Admission Cycle</legend>
  
        <div class="flex flex-col gap-2 mt-2">
          <label for="cycleId" class="text-sm font-medium text-gray-700">Available Cycles</label>
          
          <!-- PrimeNG Dropdown for cycle selection -->
          <select id="cycleId" formControlName="cycleId" 
                  class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all bg-white text-gray-700">
            <option value="" disabled selected>Select an active cycle</option>
            
            <!-- Loop through the active cycles from the store -->
            @for (cycle of store.activeCycles(); track cycle.id) {
                <option [value]="cycle.id">{{ cycle.label }}</option>
            }
          </select>
        </div>
      </fieldset>
  
      <!-- Action Buttons -->
      <div class="flex justify-end mt-4">
        <!-- PrimeNG Button for submission -->
        <p-button 
          type="submit" 
          [disabled]="createForm.invalid || store.isLoading()"
          [loading]="store.isLoading()"
          styleClass="p-button-primary px-8 py-3 rounded-lg font-bold shadow-md transition-transform hover:-translate-y-0.5">
          
          @if (store.isLoading()) {
            <span>Starting Application...</span>
          } @else {
            <div class="flex items-center gap-2">
              <span>Start Application</span>
              <i class="pi pi-arrow-right text-sm"></i>
            </div>
          }
        </p-button>
      </div>
    </form>
</div>
